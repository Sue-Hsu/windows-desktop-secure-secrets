rules:
  # ==============================================================================
  # Rule SEC-001: AppData Plaintext Storage (Python)
  # ==============================================================================
  - id: windows-appdata-plaintext-storage-python
    languages: [python]
    severity: ERROR
    metadata:
      rule_id: "SEC-001"
      cwe: "CWE-312: Cleartext Storage of Sensitive Information"
      owasp: "A04:2021 - Insecure Design"
      category: "security"
      references:
        - "https://github.com/Sue-Hsu/windows-desktop-secure-secrets"
    message: |
      [SEC-001] Plaintext persistence of secrets in user storage detected.
      In Windows desktop applications, AppData and user directories are storage locations, NOT security sandboxes.
      Any non-elevated process running under the same user account can read this file in plaintext.
      Remediation: Encrypt with Windows DPAPI (CryptProtectData) or store in Windows Credential Manager (keyring) before writing to disk.
    patterns:
      - pattern-either:
          - pattern: |
              $DATA = {..., "$KEY": $VAL, ...}
              ...
              json.dump($DATA, ...)
          - pattern: |
              json.dump({..., "$KEY": $VAL, ...}, ...)
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(key|token|secret|password|credential).*

  # ==============================================================================
  # Rule SEC-001: AppData Plaintext Storage (C#)
  # ==============================================================================
  - id: windows-appdata-plaintext-storage-csharp
    languages: [csharp]
    severity: ERROR
    metadata:
      rule_id: "SEC-001"
      cwe: "CWE-312: Cleartext Storage of Sensitive Information"
      owasp: "A04:2021 - Insecure Design"
      category: "security"
      references:
        - "https://github.com/Sue-Hsu/windows-desktop-secure-secrets"
    message: |
      [SEC-001] Writing sensitive token or credential directly to file via plaintext string.
      In Windows desktop applications, credentials must not be written as unencrypted plaintext.
      Remediation: Encrypt with System.Security.Cryptography.ProtectedData.Protect (DPAPI CurrentUser) or Windows.Security.Credentials.PasswordVault.
    patterns:
      - pattern-either:
          - pattern: File.WriteAllText($PATH, $...TOKEN);
          - pattern: File.WriteAllLines($PATH, $...TOKEN);
      - pattern-regex: (?i)(apikey|clientsecret|token|password|credential)

  # ==============================================================================
  # Rule SEC-001: AppData Plaintext Storage (JavaScript / TypeScript / Electron)
  # ==============================================================================
  - id: windows-appdata-plaintext-storage-javascript
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      rule_id: "SEC-001"
      cwe: "CWE-312: Cleartext Storage of Sensitive Information"
      owasp: "A04:2021 - Insecure Design"
      category: "security"
      references:
        - "https://github.com/Sue-Hsu/windows-desktop-secure-secrets"
    message: |
      [SEC-001] Writing sensitive token or credential directly to file via plaintext fs write.
      In Electron and Windows desktop applications, user data directories are not security sandboxes.
      Remediation: Encrypt with Electron's official safeStorage API (safeStorage.encryptString) before saving to disk.
    patterns:
      - pattern-either:
          - pattern: fs.writeFileSync($PATH, $...DATA, ...)
          - pattern: fs.promises.writeFile($PATH, $...DATA, ...)
          - pattern: fs.writeFile($PATH, $...DATA, ...)
      - pattern-regex: (?i)(apikey|clientsecret|token|password|credential)

  # ==============================================================================
  # Rule SEC-002: Hardcoded Client Secret in Public Client (C#)
  # ==============================================================================
  - id: windows-hardcoded-client-secret-csharp
    languages: [csharp]
    severity: ERROR
    metadata:
      rule_id: "SEC-002"
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      category: "security"
      references:
        - "https://github.com/Sue-Hsu/windows-desktop-secure-secrets"
    message: |
      [SEC-002] Hardcoded OAuth Client Secret detected in desktop application source code.
      Desktop applications are Public Clients. Embedded binaries can be decompiled to extract secrets.
      Remediation: Use OAuth 2.0 Authorization Code Flow with PKCE (RFC 7636). Do not store a Client Secret on the client.
    patterns:
      - pattern-either:
          - pattern: $TYPE $NAME = "$VAL";
          - pattern: const $TYPE $NAME = "$VAL";
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(client_?secret|app_?secret).*
      - metavariable-regex:
          metavariable: $VAL
          regex: .+

  # ==============================================================================
  # Rule SEC-002: Hardcoded Client Secret in Public Client (Python)
  # ==============================================================================
  - id: windows-hardcoded-client-secret-python
    languages: [python]
    severity: ERROR
    metadata:
      rule_id: "SEC-002"
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      category: "security"
      references:
        - "https://github.com/Sue-Hsu/windows-desktop-secure-secrets"
    message: |
      [SEC-002] Hardcoded OAuth Client Secret detected in Python desktop application.
      Desktop applications cannot protect client secrets.
      Remediation: Adopt Authorization Code Flow with PKCE (RFC 7636) or proxy authentication through a secure backend (BFF).
    patterns:
      - pattern: $NAME = "$VAL"
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(client_?secret|app_?secret).*
      - metavariable-regex:
          metavariable: $VAL
          regex: .+

  # ==============================================================================
  # Rule SEC-002: Hardcoded Client Secret in Public Client (JavaScript / TypeScript)
  # ==============================================================================
  - id: windows-hardcoded-client-secret-javascript
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      rule_id: "SEC-002"
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      category: "security"
      references:
        - "https://github.com/Sue-Hsu/windows-desktop-secure-secrets"
    message: |
      [SEC-002] Hardcoded OAuth Client Secret detected in JavaScript/TypeScript desktop application.
      Desktop applications cannot protect embedded client secrets.
      Remediation: Use OAuth 2.0 PKCE flow (RFC 7636). Do not embed Client Secret in desktop frontend code.
    patterns:
      - pattern-either:
          - pattern: const $NAME = "$VAL";
          - pattern: let $NAME = "$VAL";
          - pattern: var $NAME = "$VAL";
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(client_?secret|app_?secret).*
      - metavariable-regex:
          metavariable: $VAL
          regex: .+

  # ==============================================================================
  # Rule SEC-003: Silent Fallback to Plaintext (C#)
  # ==============================================================================
  - id: windows-silent-fallback-plaintext-csharp
    languages: [csharp]
    severity: ERROR
    metadata:
      rule_id: "SEC-003"
      cwe: "CWE-391: Unchecked Error Condition"
      owasp: "A04:2021 - Insecure Design"
      category: "security"
      references:
        - "https://github.com/Sue-Hsu/windows-desktop-secure-secrets"
    message: |
      [SEC-003] Silent fallback to unencrypted file writing detected in catch block.
      When secure storage or encryption APIs fail, silently writing plaintext files violates Fail-Closed security.
      Remediation: Fail closed by throwing an exception, or retain tokens only in transient session memory.
    patterns:
      - pattern-either:
          - pattern: |
              try {
                  ...
              } catch ($TYPE $EX) {
                  ...
                  File.WriteAllText($PATH, $DATA);
                  ...
              }
          - pattern: |
              try {
                  ...
              } catch {
                  ...
                  File.WriteAllText($PATH, $DATA);
                  ...
              }

  # ==============================================================================
  # Rule SEC-004: DPAPI LocalMachine Scope Abuse (C#)
  # ==============================================================================
  - id: windows-dpapi-localmachine-csharp
    languages: [csharp]
    severity: ERROR
    metadata:
      rule_id: "SEC-004"
      cwe: "CWE-276: Incorrect Default Permissions"
      owasp: "A01:2021 - Broken Access Control"
      category: "security"
      references:
        - "https://github.com/Sue-Hsu/windows-desktop-secure-secrets"
    message: |
      [SEC-004] Insecure DPAPI DataProtectionScope.LocalMachine scope used in personal desktop application.
      LocalMachine scope allows any user account or non-privileged service on the same machine to decrypt the secret.
      Remediation: Change scope to DataProtectionScope.CurrentUser to enforce user isolation.
    pattern: ProtectedData.Protect($DATA, $ENTROPY, DataProtectionScope.LocalMachine)

  # ==============================================================================
  # Rule SEC-005: Sensitive Secret Printed in Debug / Console Output (C#)
  # ==============================================================================
  - id: windows-secret-debug-logging-csharp
    languages: [csharp]
    severity: WARNING
    metadata:
      rule_id: "SEC-005"
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      owasp: "A09:2021 - Security Logging and Monitoring Failures"
      category: "security"
      references:
        - "https://github.com/Sue-Hsu/windows-desktop-secure-secrets"
    message: |
      [SEC-005] Sensitive credential or token logged to Console or debug output.
      Logging secrets causes credential leaks in log files, console scrollbacks, and crash dump telemetry.
      Remediation: Mask or sanitize secret variables before logging, or remove debug output entirely.
    patterns:
      - pattern-either:
          - pattern: Console.WriteLine($...MSG);
          - pattern: Console.Write($...MSG);
          - pattern: Debug.WriteLine($...MSG);
          - pattern: $LOGGER.Debug($...MSG);
          - pattern: $LOGGER.Info($...MSG);
      - pattern-regex: (?i)(ClientSecret|ApiKey|Password|AccessToken|RefreshToken)
